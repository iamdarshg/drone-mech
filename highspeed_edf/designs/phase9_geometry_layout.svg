<svg xmlns="http://www.w3.org/2000/svg" width="780" height="410" viewBox="0 0 780 410">
  <defs>
    <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#e8edf2" stroke-width="0.5"/></pattern>
    <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#17212b}.title{font-size:18px;font-weight:700}.label{font-size:13px}.small{font-size:11px;fill:#45525f}</style>
  </defs>
  <rect width="780" height="410" fill="#fff"/>
  <text x="24" y="30" class="title">Phase 9 fixed-powertrain geometry candidate (dimensions in mm)</text>
  <text x="24" y="51" class="small">Projection concept, not a production drawing; the duct modules are staggered axially and independently side-fed.</text>

  <text x="30" y="80" class="label" font-weight="700">Nose-on projection</text>
  <rect x="30" y="92" width="320" height="230" fill="url(#grid)" stroke="#7b8793"/>
  <!-- 2.0 px/mm: a single 90 mm projected circle, 32 mm hub. -->
  <circle cx="150" cy="190" r="90" fill="#dceeff" stroke="#17669e" stroke-width="2"/>
  <circle cx="150" cy="190" r="32" fill="#fff" stroke="#17669e" stroke-width="1.5"/>
  <text x="114" y="186" class="small">90 mm duct</text>
  <text x="134" y="207" class="small">32 hub</text>
  <rect x="245" y="170" width="100" height="40" fill="#f3ce82" fill-opacity="0.85" stroke="#956500" stroke-width="1.5"/>
  <text x="250" y="187" class="small">50×20 mm</text>
  <text x="250" y="202" class="small">= 10 cm² reserve</text>
  <text x="30" y="345" class="label" font-weight="700">63.62 cm² duct envelope + 10.00 cm² reserve = 73.62 cm² (&lt;75)</text>

  <text x="390" y="80" class="label" font-weight="700">Side-fed / axially staggered layout</text>
  <rect x="390" y="92" width="360" height="230" fill="url(#grid)" stroke="#7b8793"/>
  <text x="405" y="115" class="small">Flight direction →</text>
  <rect x="430" y="136" width="94" height="48" rx="5" fill="#dceeff" stroke="#17669e" stroke-width="2"/>
  <text x="443" y="157" class="small">duct A + 3 rotor rows</text>
  <rect x="548" y="224" width="94" height="48" rx="5" fill="#e7f2df" stroke="#477b36" stroke-width="2"/>
  <text x="560" y="245" class="small">duct B + 3 rotor rows</text>
  <path d="M410 160H428M410 248H546" fill="none" stroke="#17669e" stroke-width="4"/>
  <text x="405" y="151" class="small">50×120 side slot</text>
  <text x="405" y="239" class="small">50×120 side slot</text>
  <text x="405" y="297" class="small">Airflow crossover/pressure recovery remains for detailed CAD/rig confirmation.</text>

  <text x="30" y="378" class="small">16×50 mm stock: 16 mm rotor chord, 29 mm radial span, 8 mm stator chord; all fit dimensionally. Two 50×120 side slots = 120 cm² inlet opening.</text>
</svg>
